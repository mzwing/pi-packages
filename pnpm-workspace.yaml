shellEmulator: true
trustPolicy: no-downgrade

packages:
  - packages/*

catalog:
  '@earendil-works/pi-ai': 1.3.0
  '@earendil-works/pi-coding-agent': 1.3.0
  '@types/node': 26.6.5
  '@valibot/to-json-schema': 1.8.0
  tsdown: 0.23.1
  typebox: 1.4.2
  typescript: 7.0.2
  valibot: 1.5.0
  vitest: 5.0.5

catalogs:
  pi-peer:
    '@earendil-works/pi-ai': ^1.3.0
    '@earendil-works/pi-coding-agent': ^1.3.0
    typebox: ^1.0.0

allowBuilds:
  '@google/genai': true
  esbuild: true
  protobufjs: true
  tree-sitter-bash: true

minimumReleaseAgeExclude:
  - '@gotgenes/pi-permission-system@41.0.0'
  - typebox@1.4.2
