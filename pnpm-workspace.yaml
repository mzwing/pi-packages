catalog:
  '@earendil-works/pi-ai': 0.80.10
  '@earendil-works/pi-coding-agent': 0.80.10
  '@types/node': 26.1.1
  tsdown: 0.22.13
  typescript: 7.0.2
  vitest: 4.1.10

catalogs:
  pi-peer:
    '@earendil-works/pi-ai': ^0.80.10 || ^0.81.0
    '@earendil-works/pi-coding-agent': ^0.80.10 || ^0.81.0

allowBuilds:
  '@google/genai': true
  esbuild: true
  protobufjs: true
  tree-sitter-bash: true

minimumReleaseAgeExclude:
  - '@mzwing/oxc-config@0.1.4'
  - baseline-browser-mapping@2.11.1
  - race-expansion@5.0.8
  - flatted@3.4.3
  - brace-expansion@5.0.8
