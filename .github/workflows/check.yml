name: Check Codebase

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  statuses: write

defaults:
  run:
    # A custom shell string runs a bare `bash {0}`; only the built-in `bash`
    # shell adds -eo pipefail. Spell it out so a failing command aborts the step.
    shell: devenv shell -- bash -eo pipefail {0}

jobs:
  check:
    name: Check Codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Use the devenv cache
        uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install devenv
        shell: bash
        run: nix profile add nixpkgs#devenv

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      # pi-task-governor type-checks against the build of pi-session-hub.
      - name: Build
        run: pnpm run build

      - name: Run format & lint & typecheck & unused file check
        run: |
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          pnpm run knip

      - name: Run test
        run: pnpm run test
